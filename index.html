<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro Fotográfico Catastral</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --surface: #181c27;
  --surface2: #1e2333;
  --accent: #e05c3a;
  --done: #3ab87a;
  --partial: #e0b83a;
  --finished: #7c5fe6;
  --text: #e8e4dc;
  --muted: #7a7f94;
  --border: #2a2f44;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: "Syne", sans-serif; min-height: 100vh; }

header {
  padding: 1rem 1.8rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 1rem;
  background: var(--surface);
}
header h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.02em; }
header h1 span { color: var(--accent); }
.progress-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 0.3rem; }
.progress-label { font-family: "Space Mono", monospace; font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.progress-bar { width: 160px; height: 4px; background: var(--border); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--done)); transition: width 0.4s ease; width: 0%; }
.progress-count { font-family: "Space Mono", monospace; font-size: 0.68rem; color: var(--text); font-weight: 700; }

.legend {
  display: flex; gap: 1rem; flex-wrap: wrap;
  padding: 0.5rem 1.8rem;
  border-bottom: 1px solid var(--border);
  background: #13161f;
}
.legend-item { display: flex; align-items: center; gap: 0.4rem; font-family: "Space Mono", monospace; font-size: 0.56rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; }
.legend-dot.empty    { background: rgba(224,92,58,0.4);   border: 1px solid #e05c3a; }
.legend-dot.partial  { background: rgba(224,184,58,0.4);  border: 1px solid var(--partial); }
.legend-dot.done     { background: rgba(58,184,122,0.4);  border: 1px solid var(--done); }
.legend-dot.finished { background: rgba(124,95,230,0.5);  border: 1px solid var(--finished); }
.legend-dot.sel      { background: rgba(255,255,255,0.7); border: 1px solid white; }

main { display: flex; min-height: calc(100vh - 112px); }

/* ── MAP ── */
.map-side {
  flex: 0 0 auto;
  padding: 1.2rem 1.5rem;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 0.6rem;
}
.map-title { font-family: "Space Mono", monospace; font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.map-wrapper { position: relative; width: 438px; flex-shrink: 0; }
.map-wrapper > img { display: block; width: 100%; user-select: none; pointer-events: none; }

.block-overlay {
  position: absolute; cursor: pointer; border-radius: 2px;
  background: transparent; outline: 2px solid transparent;
  transition: background 0.12s, outline 0.1s;
}
.block-overlay:hover                { background: rgba(255,255,255,0.2);  outline: 2px solid rgba(255,255,255,0.75); z-index:5; }
.block-overlay.selected             { background: rgba(255,255,255,0.28); outline: 2px solid white; z-index:10; }
.block-overlay.status-partial       { background: rgba(224,184,58,0.22); }
.block-overlay.status-partial:hover,
.block-overlay.status-partial.selected { background: rgba(224,184,58,0.4); outline-color: var(--partial); }
.block-overlay.status-done          { background: rgba(58,184,122,0.32); }
.block-overlay.status-done:hover,
.block-overlay.status-done.selected     { background: rgba(58,184,122,0.5); outline-color: var(--done); }
.block-overlay.status-finished      { background: rgba(124,95,230,0.35); }
.block-overlay.status-finished:hover,
.block-overlay.status-finished.selected { background: rgba(124,95,230,0.55); outline-color: var(--finished); }

.block-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: "Space Mono", monospace; font-size: 7px; font-weight: 700;
  color: rgba(255,255,255,0.9); text-shadow: 0 1px 3px rgba(0,0,0,0.9);
  pointer-events: none; user-select: none;
}
.block-photo-dots { position: absolute; inset: 0; pointer-events: none; }
.photo-dot { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: white; box-shadow: 0 0 3px rgba(0,0,0,0.8); }
.photo-dot.top-left     { top:2px;    left:2px;  }
.photo-dot.top-right    { top:2px;    right:2px; }
.photo-dot.bottom-left  { bottom:2px; left:2px;  }
.photo-dot.bottom-right { bottom:2px; right:2px; }

/* Finished checkmark badge on map block */
.block-check {
  position: absolute; top: 1px; right: 1px;
  font-size: 8px; line-height: 1; pointer-events: none;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
  display: none;
}
.block-overlay.status-finished .block-check { display: block; }

/* ── PANEL ── */
.panel-side {
  flex: 1; padding: 1.5rem;
  min-width: 340px; max-width: 580px;
  overflow-y: auto;
}
.panel-empty {
  border: 1px dashed var(--border); border-radius: 12px;
  padding: 3rem 2rem; text-align: center; color: var(--muted); margin-top: 2rem;
}
.panel-empty .icon { font-size: 2.2rem; margin-bottom: 0.8rem; opacity: 0.4; }
.panel-empty p { font-family:"Space Mono",monospace; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em; line-height:1.9; }
.panel-card { display: none; }
.panel-card.active { display: block; }

.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 0.9rem; padding-bottom: 0.8rem; border-bottom: 1px solid var(--border);
  gap: 0.5rem; flex-wrap: wrap;
}
.panel-header h2 { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; }
.panel-header h2 span { color: var(--accent); }
.status-badge {
  font-family:"Space Mono",monospace; font-size:0.56rem;
  text-transform:uppercase; letter-spacing:0.1em;
  padding:0.22rem 0.6rem; border-radius:20px; font-weight:700;
}
.status-badge.empty    { background:rgba(224,92,58,0.12);  color:#e07060; border:1px solid rgba(224,92,58,0.3); }
.status-badge.partial  { background:rgba(224,184,58,0.12); color:#e0c060; border:1px solid rgba(224,184,58,0.3); }
.status-badge.done     { background:rgba(58,184,122,0.12); color:#60d090; border:1px solid rgba(58,184,122,0.3); }
.status-badge.finished { background:rgba(124,95,230,0.15); color:#b09ef5; border:1px solid rgba(124,95,230,0.4); }

/* Finished banner */
.finished-banner {
  display: none;
  align-items: center; gap: 0.6rem;
  background: rgba(124,95,230,0.1);
  border: 1px solid rgba(124,95,230,0.3);
  border-radius: 8px; padding: 0.6rem 1rem;
  margin-bottom: 1rem;
  font-family:"Space Mono",monospace; font-size:0.62rem;
  color: #b09ef5; text-transform:uppercase; letter-spacing:0.08em;
}
.finished-banner.visible { display: flex; }
.finished-banner .icon { font-size: 1rem; }
.btn-unfinish {
  margin-left: auto;
  font-family:"Space Mono",monospace; font-size:0.55rem; text-transform:uppercase;
  letter-spacing:0.08em; padding:0.25rem 0.6rem; border-radius:5px;
  background: transparent; border: 1px solid rgba(124,95,230,0.4);
  color: #b09ef5; cursor:pointer; transition:background 0.15s;
}
.btn-unfinish:hover { background: rgba(124,95,230,0.15); }

.photo-count { font-family:"Space Mono",monospace; font-size:0.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:1rem; }
.photo-count span { color:var(--accent); font-weight:700; }

/* ── 2x2 CORNER GRID ── */
.corner-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  margin-bottom: 1rem;
}

/* Each corner slot */
.corner-slot {
  border-radius: 8px;
  border: 1px dashed var(--border);
  background: var(--surface2);
  overflow: hidden;
  position: relative;
  transition: border-color 0.15s;
}
.corner-slot.has-photos { border-style: solid; }

/* Corner header label */
.corner-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 6px;
  background: rgba(0,0,0,0.3);
  border-bottom: 1px solid var(--border);
}
.corner-header-label {
  font-family:"Space Mono",monospace; font-size:6.5px; font-weight:700;
  color: var(--muted); text-transform:uppercase; letter-spacing:0.06em;
}
.corner-photo-count {
  font-family:"Space Mono",monospace; font-size:6px;
  color: var(--accent); font-weight:700;
}

/* Thumbnails row inside slot */
.corner-thumbs {
  display: flex;
  gap: 2px;
  padding: 3px;
  min-height: 62px;
  flex-wrap: nowrap;
  overflow: hidden;
}
.corner-thumb-wrap {
  flex: 1 1 0;
  min-width: 0;
  position: relative;
  border-radius: 4px;
  overflow: hidden;
  background: #0a0c12;
  cursor: zoom-in;
}
.corner-thumb-wrap img { width:100%; height:100%; object-fit:cover; display:block; min-height:56px; }
.corner-thumb-rm {
  position:absolute; top:2px; right:2px;
  width:15px; height:15px; border-radius:50%;
  background:rgba(192,57,43,0.9); border:none; color:white;
  font-size:0.5rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity 0.15s; z-index:5;
}
.corner-thumb-wrap:hover .corner-thumb-rm { opacity:1; }

/* Mini-map inside corner slot */
.corner-minimap-row {
  display: flex; align-items: center; justify-content: center;
  padding: 3px 4px;
  gap: 4px;
  border-top: 1px solid var(--border);
  background: #0a0c12;
}
.corner-minimap-row canvas { display:block; border-radius:3px; }
.corner-minimap-row span {
  font-family:"Space Mono",monospace; font-size:6px;
  color:var(--muted); text-transform:uppercase; letter-spacing:0.05em;
  line-height:1.3;
}

/* Add photo btn inside slot */
.corner-add-row {
  display: flex; justify-content: center;
  padding: 4px;
  border-top: 1px solid var(--border);
}
.corner-add-small {
  font-family:"Space Mono",monospace; font-size:6.5px; text-transform:uppercase;
  letter-spacing:0.08em; font-weight:700;
  padding:3px 8px; border-radius:5px; border:none; cursor:pointer;
  background: rgba(224,92,58,0.12); color:var(--accent);
  transition:background 0.15s; display:flex; align-items:center; gap:3px;
}
.corner-add-small:hover { background:rgba(224,92,58,0.25); }
.corner-add-small:disabled { opacity:0.35; cursor:not-allowed; }

/* Empty slot placeholder */
.corner-empty-placeholder {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:4px; min-height:80px; cursor:pointer;
  color:var(--muted); transition:color 0.15s, background 0.15s;
  font-family:"Space Mono",monospace; font-size:6.5px; text-transform:uppercase; letter-spacing:0.06em;
  border:none; background:transparent; width:100%;
}
.corner-empty-placeholder:hover { color:var(--accent); background:rgba(224,92,58,0.06); }
.corner-empty-placeholder .plus { font-size:1.4rem; line-height:1; }

/* ── ACTIONS ── */
.panel-actions {
  display: flex; gap: 0.6rem; flex-wrap: wrap; margin-top: 0.5rem;
  padding-top: 0.8rem; border-top: 1px solid var(--border);
  align-items: center;
}
.btn {
  font-family:"Space Mono",monospace; font-size:0.58rem; text-transform:uppercase;
  letter-spacing:0.1em; font-weight:700; padding:0.52rem 0.9rem;
  border-radius:7px; border:none; cursor:pointer;
  transition:all 0.15s; display:flex; align-items:center; gap:0.35rem;
}
.btn-finish {
  background: var(--finished); color: white; margin-left: auto;
  box-shadow: 0 0 12px rgba(124,95,230,0.35);
}
.btn-finish:hover { background: #6b4ed4; box-shadow: 0 0 18px rgba(124,95,230,0.5); }
.btn-primary { background:var(--accent); color:white; }
.btn-primary:hover { background:#c94e2e; }
.btn-ghost { background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
.btn-ghost:hover { border-color:var(--accent); color:var(--text); }

/* ── LIGHTBOX ── */
#lightbox {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.94); z-index:1000;
  align-items:center; justify-content:center; flex-direction:column; gap:1rem;
}
#lightbox.active { display:flex; }
#lightbox img { max-width:88vw; max-height:82vh; border-radius:8px; border:1px solid var(--border); object-fit:contain; }
#lightbox-close {
  position:absolute; top:1rem; right:1rem;
  background:var(--surface); border:1px solid var(--border);
  color:var(--text); width:36px; height:36px;
  border-radius:50%; font-size:1rem; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
#lightbox-caption { font-family:"Space Mono",monospace; font-size:0.62rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; }

@media (max-width:820px) {
  main { flex-direction:column; }
  .map-side { border-right:none; border-bottom:1px solid var(--border); width:100%; align-items:center; }
  .map-wrapper { width:min(438px,calc(100vw - 2.4rem)); }
  .panel-side { max-width:100%; }
}
</style>
</head>
<body>
<header>
  <h1>Registro <span>Catastral</span></h1>
  <div class="progress-wrap">
    <span class="progress-label">Progreso</span>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <span class="progress-count" id="progress-count">0 / 60 manzanas finalizadas</span>
  </div>
</header>
<div class="legend">
  <div class="legend-item"><div class="legend-dot empty"></div> Sin fotos</div>
  <div class="legend-item"><div class="legend-dot partial"></div> Con fotos</div>
  <div class="legend-item"><div class="legend-dot finished"></div> Finalizada ✓</div>
  <div class="legend-item"><div class="legend-dot sel"></div> Seleccionada</div>
</div>

: 2036, "x": 172, "y": 454, "w": 71, "h": 31, "cx": 207, "cy": 469, "num": 59}, {"region_id": 60, "area": 850, "x": 247, "y": 451, "w": 31, "h": 30, "cx": 262, "cy": 466, "num": 60}];
const IMG_W = 438, IMG_H = 491;
const CORNERS = ['top-left','top-right','bottom-left','bottom-right'];
const CORNER_LABELS = {
  'top-left':    '↖ Sup Izq',
  'top-right':   '↗ Sup Der',
  'bottom-left': '↙ Inf Izq',
  'bottom-right':'↘ Inf Der'
};

// photos[num][corner] = [{name, dataUrl}, ...]  (max 2 per corner)
const photos   = {};
const finished = {};   // finished[num] = true/false
let currentManzana = null;
let pendingCorner  = null;

// ── Build overlays ──
const wrapper = document.getElementById('map-wrapper');
const baseImg  = document.getElementById('base-map');

BLOCKS.forEach(b => {
  const div = document.createElement('div');
  div.className   = 'block-overlay';
  div.dataset.num = b.num;

  const lbl = document.createElement('div');
  lbl.className   = 'block-label';
  lbl.textContent = b.num;
  div.appendChild(lbl);

  const dots = document.createElement('div');
  dots.className = 'block-photo-dots';
  dots.id = 'dots-' + b.num;
  div.appendChild(dots);

  const chk = document.createElement('div');
  chk.className   = 'block-check';
  chk.textContent = '✓';
  div.appendChild(chk);

  div.onclick = () => selectManzana(b.num);
  wrapper.appendChild(div);
});

function reposition() {
  const s = wrapper.offsetWidth / IMG_W;
  wrapper.style.height = Math.round(IMG_H * s) + 'px';
  BLOCKS.forEach(b => {
    const d = wrapper.querySelector('.block-overlay[data-num="'+b.num+'"]');
    if (!d) return;
    d.style.left   = Math.round(b.x * s) + 'px';
    d.style.top    = Math.round(b.y * s) + 'px';
    d.style.width  = Math.round(b.w * s) + 'px';
    d.style.height = Math.round(b.h * s) + 'px';
  });
}
window.addEventListener('resize', reposition);
baseImg.addEventListener('load', reposition);
reposition();

// ── Select ──
function selectManzana(num) {
  currentManzana = num;
  if (!photos[num])   photos[num]   = {};
  document.querySelectorAll('.block-overlay').forEach(d => d.classList.remove('selected'));
  const sel = wrapper.querySelector('.block-overlay[data-num="'+num+'"]');
  if (sel) sel.classList.add('selected');
  document.getElementById('panel-empty').style.display = 'none';
  document.getElementById('panel-card').classList.add('active');
  document.getElementById('panel-num').textContent = num;
  renderPanel();
}

// ── Render panel ──
function renderPanel() {
  const num = currentManzana;
  const p   = photos[num] || {};
  const isFinished = !!finished[num];

  // Count total photos and occupied corners
  let totalPhotos = 0, occupiedCorners = 0;
  CORNERS.forEach(c => {
    const arr = p[c] || [];
    if (arr.length > 0) { occupiedCorners++; totalPhotos += arr.length; }
  });

  document.getElementById('photo-count').textContent  = totalPhotos;
  document.getElementById('corner-count').textContent = occupiedCorners;

  // Status badge
  const badge = document.getElementById('status-badge');
  badge.className = 'status-badge';
  if (isFinished) {
    badge.textContent = '✓ Finalizada'; badge.classList.add('finished');
  } else if (totalPhotos === 0) {
    badge.textContent = 'Sin fotos';    badge.classList.add('empty');
  } else {
    badge.textContent = totalPhotos + ' foto' + (totalPhotos > 1 ? 's' : ''); badge.classList.add('partial');
  }

  // Finished banner
  const banner = document.getElementById('finished-banner');
  banner.classList.toggle('visible', isFinished);

  // Finish button
  const btnFinish = document.getElementById('btn-finish');
  btnFinish.style.display = isFinished ? 'none' : 'flex';

  // Build corner grid
  const grid = document.getElementById('corner-grid');
  grid.innerHTML = '';

  CORNERS.forEach(corner => {
    const arr = p[corner] || [];
    const slot = document.createElement('div');
    slot.className = 'corner-slot' + (arr.length > 0 ? ' has-photos' : '');

    // Header
    const hdr = document.createElement('div');
    hdr.className = 'corner-header';
    const hdrlbl = document.createElement('span');
    hdrlbl.className   = 'corner-header-label';
    hdrlbl.textContent = CORNER_LABELS[corner];
    hdr.appendChild(hdrlbl);
    if (arr.length > 0) {
      const cnt = document.createElement('span');
      cnt.className   = 'corner-photo-count';
      cnt.textContent = arr.length + '/2';
      hdr.appendChild(cnt);
    }
    slot.appendChild(hdr);

    if (arr.length > 0) {
      // Thumbnails row
      const thumbRow = document.createElement('div');
      thumbRow.className = 'corner-thumbs';
      arr.forEach((photo, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'corner-thumb-wrap';
        wrap.onclick = () => openLightbox(corner, idx);

        const img = document.createElement('img');
        img.src = photo.dataUrl;
        img.alt = corner + '-' + idx;
        wrap.appendChild(img);

        if (!isFinished) {
          const rm = document.createElement('button');
          rm.className = 'corner-thumb-rm';
          rm.textContent = '✕';
          rm.onclick = (e) => { e.stopPropagation(); removePhoto(corner, idx); };
          wrap.appendChild(rm);
        }
        thumbRow.appendChild(wrap);
      });
      slot.appendChild(thumbRow);

      // Mini-map
      const mmRow = document.createElement('div');
      mmRow.className = 'corner-minimap-row';
      const canvas = document.createElement('canvas');
      canvas.width = 54; canvas.height = 54;
      mmRow.appendChild(canvas);
      const mmSpan = document.createElement('span');
      mmSpan.textContent = 'Ubicación\nen manzana';
      mmRow.appendChild(mmSpan);
      slot.appendChild(mmRow);
      requestAnimationFrame(() => drawMiniMap(canvas, num, corner));

      // Add second photo button (if < 2 and not finished)
      if (arr.length < 2 && !isFinished) {
        const addRow = document.createElement('div');
        addRow.className = 'corner-add-row';
        const addBtn = document.createElement('button');
        addBtn.className = 'corner-add-small';
        addBtn.innerHTML = '+ 2ª foto';
        addBtn.onclick = () => triggerUpload(corner);
        addRow.appendChild(addBtn);
        slot.appendChild(addRow);
      }

    } else {
      // Empty placeholder
      if (!isFinished) {
        const ph = document.createElement('button');
        ph.className = 'corner-empty-placeholder';
        ph.innerHTML = '<span class="plus">+</span>Agregar foto';
        ph.onclick = () => triggerUpload(corner);
        slot.appendChild(ph);
      } else {
        const ph = document.createElement('div');
        ph.className = 'corner-empty-placeholder';
        ph.style.cursor = 'default';
        ph.innerHTML = '<span style="opacity:0.3;font-size:1rem">—</span>';
        slot.appendChild(ph);
      }
    }

    grid.appendChild(slot);
  });

  document.getElementById('download-btn').style.display = totalPhotos > 0 ? 'flex' : 'none';
  updateBlockStatus(num);
  updateBlockDots(num);
  updateProgress();
}

// ── Mini-map ──
function drawMiniMap(canvas, num, activeCorner) {
  const block = BLOCKS.find(b => b.num === num);
  if (!block || !baseImg.complete) return;
  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const PAD  = Math.max(block.w, block.h) * 1.0;
  const srcX = Math.max(0, block.cx - PAD);
  const srcY = Math.max(0, block.cy - PAD);
  const srcW = Math.min(IMG_W - srcX, PAD * 2 + block.w);
  const srcH = Math.min(IMG_H - srcY, PAD * 2 + block.h);
  const scale = Math.min(W / srcW, H / srcH);
  const drawW = srcW * scale, drawH = srcH * scale;
  const offX  = (W - drawW) / 2, offY = (H - drawH) / 2;

  ctx.fillStyle = '#0a0c12';
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(baseImg, srcX, srcY, srcW, srcH, offX, offY, drawW, drawH);
  ctx.fillStyle = 'rgba(0,0,0,0.48)';
  ctx.fillRect(offX, offY, drawW, drawH);

  const bx = offX + (block.x - srcX) * scale;
  const by = offY + (block.y - srcY) * scale;
  const bw = block.w * scale, bh = block.h * scale;

  ctx.save();
  ctx.beginPath(); ctx.rect(bx, by, bw, bh); ctx.clip();
  ctx.drawImage(baseImg, srcX, srcY, srcW, srcH, offX, offY, drawW, drawH);
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);

  const dotPos = {
    'top-left':     { x: bx + 4,      y: by + 4      },
    'top-right':    { x: bx + bw - 4, y: by + 4      },
    'bottom-left':  { x: bx + 4,      y: by + bh - 4 },
    'bottom-right': { x: bx + bw - 4, y: by + bh - 4 }
  };

  const p = photos[num] || {};
  CORNERS.forEach(c => {
    const hasPh = (p[c] || []).length > 0;
    if (!hasPh) return;
    const pos  = dotPos[c];
    const isMe = (c === activeCorner);
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, isMe ? 4 : 2.5, 0, Math.PI * 2);
    ctx.fillStyle   = isMe ? '#e05c3a' : 'rgba(255,255,255,0.5)';
    ctx.fill();
    ctx.strokeStyle = 'white'; ctx.lineWidth = isMe ? 1.5 : 1; ctx.stroke();
  });

  const aPos = dotPos[activeCorner];
  ctx.beginPath(); ctx.arc(aPos.x, aPos.y, 7, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(224,92,58,0.4)'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = 'rgba(0,0,0,0.75)';
  ctx.fillRect(bx, by, 18, 11);
  ctx.fillStyle = 'white'; ctx.font = 'bold 7px monospace';
  ctx.fillText(String(num), bx + 2, by + 9);
}

// ── Upload ──
function triggerUpload(corner) {
  pendingCorner = corner;
  document.getElementById('file-input').click();
}
function handleFile(event) {
  const file = event.target.files[0];
  if (!file || !pendingCorner) return;
  event.target.value = '';
  const corner = pendingCorner;
  pendingCorner = null;
  const reader = new FileReader();
  reader.onload = (e) => {
    const num = currentManzana;
    if (!photos[num]) photos[num] = {};
    if (!photos[num][corner]) photos[num][corner] = [];
    if (photos[num][corner].length >= 2) return; // max 2
    photos[num][corner].push({ name: file.name, dataUrl: e.target.result });
    renderPanel();
  };
  reader.readAsDataURL(file);
}

function removePhoto(corner, idx) {
  if (photos[currentManzana] && photos[currentManzana][corner]) {
    photos[currentManzana][corner].splice(idx, 1);
    if (photos[currentManzana][corner].length === 0)
      delete photos[currentManzana][corner];
  }
  renderPanel();
}

function clearManzana() {
  if (!currentManzana) return;
  const p = photos[currentManzana] || {};
  const total = Object.values(p).reduce((s, a) => s + a.length, 0);
  if (total > 0 && !confirm('¿Eliminar todas las fotos de Manzana ' + currentManzana + '?')) return;
  photos[currentManzana]   = {};
  finished[currentManzana] = false;
  renderPanel();
}

// ── Finish / Unfinish ──
function finishManzana() {
  finished[currentManzana] = true;
  renderPanel();
}
function unfinishManzana() {
  finished[currentManzana] = false;
  renderPanel();
}

// ── Block status ──
function updateBlockStatus(num) {
  const div = wrapper.querySelector('.block-overlay[data-num="'+num+'"]');
  if (!div) return;
  const p     = photos[num] || {};
  const total = Object.values(p).reduce((s, a) => s + a.length, 0);
  div.classList.remove('status-partial','status-done','status-finished');
  if      (finished[num])  div.classList.add('status-finished');
  else if (total > 0)      div.classList.add('status-partial');
}
function updateBlockDots(num) {
  const el = document.getElementById('dots-' + num);
  if (!el) return;
  el.innerHTML = '';
  if (finished[num]) return; // checkmark shows instead
  const p = photos[num] || {};
  CORNERS.forEach(c => {
    if ((p[c] || []).length > 0) {
      const dot = document.createElement('div');
      dot.className = 'photo-dot ' + c;
      el.appendChild(dot);
    }
  });
}
function updateProgress() {
  const n = Object.keys(finished).filter(k => finished[k]).length;
  document.getElementById('progress-fill').style.width = (n / 60 * 100) + '%';
  document.getElementById('progress-count').textContent = n + ' / 60 manzanas finalizadas';
}

// ── Download ──
function downloadPhotos() {
  const p = photos[currentManzana] || {};
  Object.entries(p).forEach(([corner, arr]) => {
    arr.forEach((photo, idx) => {
      const a = document.createElement('a');
      a.href     = photo.dataUrl;
      a.download = 'Manzana_' + currentManzana + '_' + corner + '_foto' + (idx+1) + '_' + photo.name;
      a.click();
    });
  });
}

// ── Lightbox ──
function openLightbox(corner, idx) {
  const photo = (photos[currentManzana][corner] || [])[idx];
  if (!photo) return;
  document.getElementById('lightbox-img').src = photo.dataUrl;
  const names = {'top-left':'Superior Izquierda','top-right':'Superior Derecha','bottom-left':'Inferior Izquierda','bottom-right':'Inferior Derecha'};
  document.getElementById('lightbox-caption').textContent =
    'Manzana ' + currentManzana + ' — ' + names[corner] + ' · Foto ' + (idx+1);
  document.getElementById('lightbox').classList.add('active');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('active'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
